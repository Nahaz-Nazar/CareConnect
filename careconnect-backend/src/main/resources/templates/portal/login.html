
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect | Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0f2fe, #eef2ff, #f0fdfa);
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.10);
        }

        .brand {
            color: #087e8b;
            font-size: 30px;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
        }

        .btn-login {
            background: #087e8b;
            color: white;
            padding: 12px;
            border-radius: 9px;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #066570;
            color: white;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">
        <div class="brand">CareConnect</div>
        <p class="subtitle">Hospital Management Portal</p>
    </div>

    <h4 class="text-center mb-2">Admin Login</h4>
    <p class="text-center text-secondary mb-4">
        Sign in to manage your hospital
    </p>

    <div th:if="${param.error}" class="alert alert-danger">
        Invalid email or password.
    </div>

    <div th:if="${param.logout}" class="alert alert-success">
        You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input
                type="email"
                name="username"
                class="form-control"
                placeholder="Enter your email"
                required>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required>
        </div>

        <button type="submit" class="btn btn-login w-100">
            Sign In
        </button>

    </form>

    <p class="text-center text-secondary mt-4 mb-0">
        © 2026 CareConnect. All rights reserved.
    </p>

</div>

</body>
</html>
