
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Management | CareConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            color: #123b50;
        }
        .topbar {
            background: #123b50;
            color: white;
            padding: 18px 30px;
        }
        .content { padding: 35px; }
        .page-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(18,59,80,.06);
        }
        .btn-teal {
            background: #087e8b;
            color: white;
        }
        .btn-teal:hover {
            background: #066873;
            color: white;
        }
        .table thead th {
            background: #e1f5f3;
            color: #123b50;
            white-space: nowrap;
        }
        .status-active {
            background: #d1fae5;
            color: #047857;
        }
        .status-inactive {
            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>

<body>

<div class="topbar d-flex justify-content-between align-items-center">
    <h4 class="mb-0"><i class="fa-solid fa-heart-pulse"></i> CareConnect</h4>
    <a href="/" class="btn btn-outline-light btn-sm">
        <i class="fa-solid fa-house"></i> Dashboard
    </a>
</div>

<div class="content">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="fw-bold">Doctor Management</h2>
            <p class="text-secondary mb-0">Manage hospital doctors and their details.</p>
        </div>

        <a th:href="@{/admin/doctors/new}" class="btn btn-teal">
            <i class="fa-solid fa-plus"></i> Add New Doctor
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}" class="alert alert-danger"
         th:text="${errorMessage}"></div>

    <div class="page-card">

        <form th:action="@{/admin/doctors}" method="get"
              class="row g-2 mb-4">

            <div class="col-md-5">
                <input type="text" name="keyword"
                       class="form-control"
                       placeholder="Search doctor by name..."
                       th:value="${keyword}">
            </div>

            <div class="col-auto">
                <button type="submit" class="btn btn-teal">
                    <i class="fa-solid fa-search"></i> Search
                </button>
            </div>

            <div class="col-auto">
                <a th:href="@{/admin/doctors}"
                   class="btn btn-outline-secondary">Reset</a>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Doctor Name</th>
                    <th>Specialization</th>
                    <th>Qualification</th>
                    <th>Experience</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Fee</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="doctor : ${doctors}">
                    <td th:text="${doctor.id}"></td>
                    <td class="fw-semibold" th:text="${doctor.name}"></td>
                    <td th:text="${doctor.specialization}"></td>
                    <td th:text="${doctor.qualification}"></td>
                    <td th:text="${doctor.experience} + ' years'"></td>
                    <td th:text="${doctor.phoneNumber}"></td>
                    <td th:text="${doctor.email}"></td>
                    <td th:text="${doctor.consultationFee}"></td>

                    <td>
                        <span th:if="${doctor.isActive}"
                              class="badge status-active">Active</span>
                        <span th:unless="${doctor.isActive}"
                              class="badge status-inactive">Inactive</span>
                    </td>

                    <td class="text-nowrap">
                        <a th:href="@{/admin/doctors/edit/{id}(id=${doctor.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="fa-solid fa-pen"></i>
                        </a>

                        <a th:href="@{/admin/doctors/delete/{id}(id=${doctor.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Are you sure you want to delete this doctor?')">
                            <i class="fa-solid fa-trash"></i>
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(doctors)}">
                    <td colspan="10" class="text-center text-secondary py-5">
                        <i class="fa-solid fa-user-doctor fa-2x mb-3"></i>
                        <p class="mb-0">No doctors found.</p>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

</body>
</html>
