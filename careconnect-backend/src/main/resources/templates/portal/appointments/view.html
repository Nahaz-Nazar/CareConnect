
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Details | CareConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            color: #263746;
        }

        .page-header {
            background: #123b50;
            color: white;
            padding: 25px 30px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .details-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        .detail-item {
            padding: 18px 10px;
            border-bottom: 1px solid #edf0f4;
        }

        .detail-label {
            color: #718096;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .detail-value {
            color: #123b50;
            font-weight: 600;
            font-size: 16px;
        }

        .status-badge {
            display: inline-block;
            background: #e1f5f3;
            color: #087e8b;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container py-4">

    <!-- Header -->
    <div class="page-header">
        <h2>
            <i class="fa-solid fa-calendar-check me-2"></i>
            Appointment Details
        </h2>
        <p class="mb-0 mt-2">
            View complete appointment information
        </p>
    </div>

    <!-- Details -->
    <div class="details-card">

        <h5 class="mb-4">
            <i class="fa-solid fa-circle-info me-2 text-info"></i>
            Appointment Information
        </h5>

        <div class="row">

            <div class="col-md-6 detail-item">
                <div class="detail-label">Appointment ID</div>
                <div class="detail-value"
                     th:text="${appointment.id}"></div>
            </div>

            <div class="col-md-6 detail-item">
                <div class="detail-label">Appointment Status</div>
                <div>
                    <span class="status-badge"
                          th:text="${appointment.status}"></span>
                </div>
            </div>

            <div class="col-md-6 detail-item">
                <div class="detail-label">Patient Name</div>
                <div class="detail-value"
                     th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName}">
                </div>
            </div>

            <div class="col-md-6 detail-item">
                <div class="detail-label">Patient Email</div>
                <div class="detail-value"
                     th:text="${appointment.patient.email}"></div>
            </div>

            <div class="col-md-6 detail-item">
                <div class="detail-label">Patient Phone</div>
                <div class="detail-value"
                     th:text="${appointment.patient.phoneNumber}"></div>
            </div>

            <div class="col-md-6 detail-item">
                <div class="detail-label">Doctor Name</div>
                <div class="detail-value"
                     th:text="${appointment.doctor.name}"></div>
            </div>

            <div class="col-md-6 detail-item">
                <div class="detail-label">Doctor Specialization</div>
                <div class="detail-value"
                     th:text="${appointment.doctor.specialization}"></div>
            </div>

            <div class="col-md-6 detail-item">
                <div class="detail-label">Appointment Date</div>
                <div class="detail-value"
                     th:text="${appointment.appointmentDate}"></div>
            </div>

            <div class="col-md-6 detail-item">
                <div class="detail-label">Appointment Time</div>
                <div class="detail-value"
                     th:text="${appointment.appointmentTime}"></div>
            </div>

        </div>

        <div class="mt-4">
            <a th:href="@{/appointments}"
               class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left me-2"></i>
                Back to Appointments
            </a>
        </div>

    </div>

    <div class="text-center text-muted mt-4">
        <small>© 2026 CareConnect Hospital Management System</small>
    </div>

</div>

</body>
</html>
