
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Form | CareConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
            color: #123b50;
        }
        .topbar {
            background: #123b50;
            color: white;
            padding: 18px 30px;
        }
        .content {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 18px;
        }
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(18,59,80,.07);
        }
        .btn-teal {
            background: #087e8b;
            color: white;
        }
        .btn-teal:hover {
            background: #066873;
            color: white;
        }
        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="topbar d-flex justify-content-between align-items-center">
    <h4 class="mb-0">
        <i class="fa-solid fa-heart-pulse"></i> CareConnect
    </h4>

    <a th:href="@{/admin/doctors}" class="btn btn-outline-light btn-sm">
        <i class="fa-solid fa-arrow-left"></i> Back to Doctors
    </a>
</div>

<div class="content">

    <div class="form-card">

        <h2 class="fw-bold mb-1" th:text="${pageTitle}">Doctor Form</h2>
        <p class="text-secondary mb-4">
            Enter the doctor's professional and contact information.
        </p>

        <form th:object="${doctor}"
              th:action="${doctor.id == null}
                    ? @{/admin/doctors/save}
                    : @{/admin/doctors/update/{id}(id=${doctor.id})}"
              method="post">

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Doctor Name *</label>
                    <input type="text" th:field="*{name}"
                           class="form-control"
                           placeholder="Enter doctor name"
                           required maxlength="100">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Specialization *</label>
                    <input type="text" th:field="*{specialization}"
                           class="form-control"
                           placeholder="e.g. Cardiology"
                           required maxlength="100">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Qualification *</label>
                    <input type="text" th:field="*{qualification}"
                           class="form-control"
                           placeholder="e.g. MBBS, MD"
                           required maxlength="100">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Experience (Years) *</label>
                    <input type="number" th:field="*{experience}"
                           class="form-control"
                           min="0" max="60" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Phone Number *</label>
                    <input type="tel" th:field="*{phoneNumber}"
                           class="form-control"
                           placeholder="Enter phone number"
                           pattern="[0-9]{10,15}"
                           title="Enter 10 to 15 digits"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email *</label>
                    <input type="email" th:field="*{email}"
                           class="form-control"
                           placeholder="doctor@example.com"
                           required maxlength="100">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Consultation Fee *</label>
                    <input type="number" th:field="*{consultationFee}"
                           class="form-control"
                           placeholder="Enter consultation fee"
                           min="0" step="0.01" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Account Status</label>
                    <select th:field="*{isActive}" class="form-select">
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>

            </div>

            <hr class="my-4">

            <div class="d-flex gap-2 justify-content-end">
                <a th:href="@{/admin/doctors}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-teal px-4">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Doctor
                </button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
